name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: python3 -m py_compile main.py charging.py rgb.py runtime-restore.py plugin_loader_recovery.py
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n runtime-restore-guard.sh install.sh updater.sh
      - name: Assemble plugin
        run: |
          mkdir -p release/RK-Enhanced
          cp -r dist docs main.py charging.py rgb.py runtime-restore.py plugin_loader_recovery.py runtime-restore-guard.sh plugin.json install.sh updater.sh README.md CHANGELOG.md LICENSE release/RK-Enhanced/
          printf '%s\n' "${GITHUB_REF_NAME}" > release/RK-Enhanced/VERSION
          chmod 755 release/RK-Enhanced/runtime-restore.py release/RK-Enhanced/plugin_loader_recovery.py release/RK-Enhanced/runtime-restore-guard.sh release/RK-Enhanced/install.sh release/RK-Enhanced/updater.sh
          cd release
          zip -r RK-Enhanced.zip RK-Enhanced
      - uses: actions/upload-artifact@v4
        with:
          name: RK-Enhanced
          path: release/RK-Enhanced.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/RK-Enhanced.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
